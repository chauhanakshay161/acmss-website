# GitHub Pages build settings for acmss.ca
url: "https://acmss.ca"
title: AC Manufacturing Solutions
plugins:
  - jekyll-sitemap
defaults:
  - scope: { path: "thanks.html" }
    values: { sitemap: false }
  - scope: { path: "404.html" }
    values: { sitemap: false }
exclude:
  - README.md
  - "ChatGPT Image Jan 15, 2026, 07_51_28 PM.png"
  - Logo.png
  - assets/images/hero.png
  - assets/images/logo.png
  - assets/images/logo11.png
  - assets/images/logo111.png
