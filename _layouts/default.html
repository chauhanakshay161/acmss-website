<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="canonical" href="https://acmss.ca{{ page.canonical }}">
  <meta name="theme-color" content="#07111C">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AC Manufacturing Solutions">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="https://acmss.ca{{ page.canonical }}">
  <meta property="og:locale" content="en_CA">

  <script>
    document.documentElement.classList.add("js");
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("no-scrolly");
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="/assets/style.css?v=5">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "AC Manufacturing Solutions",
    "url": "https://acmss.ca/",
    "email": "hello@acmss.ca",
    "description": "Process standardization, throughput analysis and quality documentation for small and mid-size manufacturers.",
    "areaServed": ["Ottawa", "Eastern Ontario"],
    "address": { "@type": "PostalAddress", "addressLocality": "Ottawa", "addressRegion": "ON", "addressCountry": "CA" },
    "sameAs": ["https://www.linkedin.com/company/acmanufacturingsolutions/"]
  }
  </script>
</head>
<body data-page="{{ page.slug }}">
  <a class="skip-link" href="#main">Skip to content</a>

  {% include header.html %}

  <main id="main">
{{ content }}
  </main>

  {% include footer.html %}

  <script src="/assets/site.js?v=5" defer></script>
</body>
</html>
